title: Reduck blog
description: >-
  What we learn building browser infrastructure for AI agents — engineering notes, product
  decisions and lessons from making automation reliable on the open web.
url: https://blog.reduck.ai
app_url: https://reduck.ai
discord_url: https://discord.gg/MPBQWCVTAq
lang: en
locale: en_US

# What the home page puts after its own name, in the title bar and on a search result, and what
# the share card says in its own words. Every other page has a title of its own to say there; only
# the front of the blog has to borrow one.
tagline: What we learn building browser infrastructure

# The card a link to a page without a picture of its own unfurls into, drawn at the 1200x630 the
# head declares for it. A post's own cover takes its place wherever there is one. Its alt text is
# built from the tagline, because it describes a picture that says the tagline.
og_image: /assets/img/og.png

# The account a card is attributed to on X.
x_handle: "@ReduckAI"

# The Cloudflare Stream account's playback domain, used by _includes/stream.html to embed videos.
cloudflare_stream_domain: customer-469wlygs2m99dfwt.cloudflarestream.com

collections:
    articles:
        output: true
        # Never the address of a post — `_plugins/reduck_blog.rb` writes each one from its folder
        # name. It is here because the same setting decides where an image beside a post is
        # written, and the default puts it under an `/articles/` prefix this site has no room for.
        permalink: /:path/

markdown: kramdown

kramdown:
    input: GFM
    hard_wrap: false
    syntax_highlighter: rouge

plugins:
    - jekyll-sitemap

defaults:
    - scope:
          path: ""
          type: articles
      values:
          layout: article

exclude:
    - Gemfile
    - Gemfile.lock
    - README.md
    - vendor
    - .github
